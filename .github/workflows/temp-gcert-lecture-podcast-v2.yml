name: Build G-Certificate Lecture Podcast V2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Reconstruct and verify source CSV
        shell: bash
        run: |
          set -euo pipefail
          cat podcast-v2/source_csv.part*.b64 > /tmp/gcert.csv.gz.b64
          base64 --decode /tmp/gcert.csv.gz.b64 | gzip -dc > 'podcast-v2/G検定模試1_問題1-145.csv'
          test "$(sha256sum 'podcast-v2/G検定模試1_問題1-145.csv' | cut -d' ' -f1)" = "22fc491b39de8c54a881b4e3ef05ee84a172e50097bad367b710ecba24f4efbc"
          python - <<'PY'
          import csv
          p='podcast-v2/G検定模試1_問題1-145.csv'
          with open(p, encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==145, len(rows)
          assert [r['ID'] for r in rows]==[str(i) for i in range(1,146)]
          assert rows[1]['カテゴリ']=='（PDF未掲載）'
          print('source CSV verified:', len(rows), 'rows')
          PY

      - name: Generate category lecture podcast
        run: |
          set -euo pipefail
          python podcast-v2/build_gcert_lecture_podcast.py 2>&1 | tee lecture-podcast-build.log

      - name: Package and verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s 'lecture-podcast-output/G検定模試1_講義Podcast_全編.mp3'
          test "$(find lecture-podcast-output/episodes -maxdepth 1 -name '*.mp3' | wc -l)" -eq 10
          cd lecture-podcast-output
          zip -9 -r 'G検定模試1_講義Podcast_分割版.zip' episodes 'G検定模試1_講義Podcast_台本.txt' 'G検定模試1_講義Podcast_manifest.json' 'G検定模試1_講義Podcast_検証結果.txt'
          unzip -t 'G検定模試1_講義Podcast_分割版.zip'
          cd ..
          cp lecture-podcast-build.log lecture-podcast-output/lecture-podcast-build.log
          ls -lh lecture-podcast-output lecture-podcast-output/episodes

      - name: Upload revised podcast artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcert-lecture-podcast-v2
          path: lecture-podcast-output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
