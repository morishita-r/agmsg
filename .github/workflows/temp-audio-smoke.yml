name: Temporary Audio Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthesize Japanese voice samples
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          edge-tts --voice ja-JP-NanamiNeural --text '女性音声の確認です。明朗で聞き取りやすく読み上げます。' --write-media female.mp3
          edge-tts --voice ja-JP-KeitaNeural --text '男性音声の確認です。正解と解説を分かりやすく説明します。' --write-media male.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 female.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 male.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: tts-smoke-artifact
          path: |
            female.mp3
            male.mp3
          compression-level: 0
