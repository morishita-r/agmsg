name: Temporary Audio Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo 'public actions work' > smoke.txt
          ffmpeg -version | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-artifact
          path: smoke.txt
