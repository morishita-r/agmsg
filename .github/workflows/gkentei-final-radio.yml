name: Build final Gkentei manga radio

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gkentei-final-radio.yml"
      - "gkentei-final-radio-build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gkentei-final-radio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore immutable sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat gkentei-final-radio-build/script/part_*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > build/build_final_radio.py
          cat gkentei-final-radio-build/transcript/part_*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > build/final_tts.txt
          echo "db41594da9c3a5dd37fa14dcaa5d4a9c1bc187b625088ef7c3a0c9074e087f72  build/build_final_radio.py" | sha256sum --check
          echo "11eff3f937ce77bc7ee10a822d84fde37c76e9c6d3387b9cb9f8a819ca6d79a7  build/final_tts.txt" | sha256sum --check
      - name: Validate exact final transcript
        run: python build/build_final_radio.py validate --transcript build/final_tts.txt --output validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: final-radio-validation
          path: validation.json
          if-no-files-found: error
          retention-days: 3

  synthesize:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        chapter: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore immutable sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat gkentei-final-radio-build/script/part_*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > build/build_final_radio.py
          cat gkentei-final-radio-build/transcript/part_*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > build/final_tts.txt
          echo "db41594da9c3a5dd37fa14dcaa5d4a9c1bc187b625088ef7c3a0c9074e087f72  build/build_final_radio.py" | sha256sum --check
          echo "11eff3f937ce77bc7ee10a822d84fde37c76e9c6d3387b9cb9f8a819ca6d79a7  build/final_tts.txt" | sha256sum --check
      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "edge-tts>=7.2,<8"
      - name: Synthesize chapter ${{ matrix.chapter }}
        run: python build/build_final_radio.py synthesize --transcript build/final_tts.txt --chapter "${{ matrix.chapter }}" --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: final-radio-chapter-${{ matrix.chapter }}
          path: |
            dist/gkentei_final_radio_chapter_*.mp3
            dist/gkentei_final_radio_chapter_*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  package:
    needs: synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore immutable sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat gkentei-final-radio-build/script/part_*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > build/build_final_radio.py
          cat gkentei-final-radio-build/transcript/part_*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > build/final_tts.txt
          echo "db41594da9c3a5dd37fa14dcaa5d4a9c1bc187b625088ef7c3a0c9074e087f72  build/build_final_radio.py" | sha256sum --check
          echo "11eff3f937ce77bc7ee10a822d84fde37c76e9c6d3387b9cb9f8a819ca6d79a7  build/final_tts.txt" | sha256sum --check
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: final-radio-chapter-*
          path: downloaded
          merge-multiple: true
      - name: Package final delivery
        run: python build/build_final_radio.py package --source-dir downloaded --transcript build/final_tts.txt --output-dir final
      - uses: actions/upload-artifact@v4
        with:
          name: Gkentei-Final-Manga-Radio-Download
          path: |
            final/gkentei_final_radio_preview_90s.mp3
            final/gkentei_final_radio_preview_5min.mp3
            final/gkentei_final_radio_full_light_40k.mp3
            final/gkentei_final_radio_pack*_40k.mp3
            final/gkentei_final_radio_tts.txt
            final/gkentei_final_radio_verification.json
            final/gkentei_final_radio_verification.txt
            final/gkentei_final_radio_SHA256SUMS.txt
            final/gkentei_final_radio_delivery_manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
