name: Export Gkentei continuation VOICEVOX MP3

on:
  push:
    branches:
      - tmp/gkentei-continuation-transfer-20260904
    paths:
      - ".github/workflows/export-gkentei-continuation.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify the complete MP3
        shell: bash
        env:
          SIGNED_URL_B64: ""
        run: |
          set -euo pipefail
          FILE=gkentei_continuation_ch11-24_voicevox_zundamon_metan_full.mp3
          URL=$(printf '%s' "$SIGNED_URL_B64" | base64 --decode)
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$URL" --output "$FILE"
          test "$(stat -c '%s' "$FILE")" -eq 53537740
          echo "c8f4f3a552271bdb6e9d650aa99ef220022a0ef81494da58bae9c722733891d1  $FILE" | sha256sum --check

      - name: Upload exactly one complete audio file
        uses: actions/upload-artifact@v4
        with:
          name: Gkentei-Continuation-VOICEVOX-Full
          path: gkentei_continuation_ch11-24_voicevox_zundamon_metan_full.mp3
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
