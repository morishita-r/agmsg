name: Attach verified Gkentei VOICEVOX MP3

on:
  push:
    branches:
      - tmp/gkentei-voicevox-transfer-20260903
    paths:
      - ".github/workflows/export-gkentei-voicevox.yml"

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the verified complete MP3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=gkentei_voicevox_zundamon_metan_full.mp3
          gh release download "gkentei-voicevox-export-20260903" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$FILE" \
            --dir .
          test "$(stat -c '%s' "$FILE")" -eq 34763940
          echo "85f235e9ff616b6590a3ef790daa81a8b360381625ec844ea2c3fb6858453c40  $FILE" | sha256sum --check

      - name: Upload one complete audio file
        uses: actions/upload-artifact@v4
        with:
          name: Gkentei-VOICEVOX-Full
          path: gkentei_voicevox_zundamon_metan_full.mp3
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
